tool: model-only-kimi-k3
name: Kimi K3 (model only)
# A baseline, not a product: the model answers from its own knowledge with no web access.
# Billed per token, so cost is computed in harness/adapters/model_only.py from the provider's
# per-million-token rates where they are pinned, not from a list price here.
pricing:
  mode: none
setups:
  # The list call returns names and domains; each company is then described from its
  # fetched homepage in a separate call that never sees the seed.
  list_then_describe: {}
